<!doctype html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Canvas - parte 1</title>
        <style type="text/css">
            html {
                height: 100%;
            }

            body {
                margin: 0;
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
            }

            /* Reserva o espaço necessário para os controles da parte 2. */
            body > div {
                flex: 0 0 auto;
            }

            canvas {
                display: block;
                flex: 1 1 0;
                min-width: 0;
                min-height: 0;
                width: 100%;
                border: 0;

                /* Desenha a borda dentro do Canvas, sem aumentar suas dimensões. */
                box-shadow: inset 0 0 0 1px black;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script src="canvas.js"></script>
    </body>
</html>
